<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VIVA MENTE</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <!-- LOGO -->
        <section class="login-brand">

            <div class="login-logo">
                <i class="fas fa-brain"></i>
            </div>

            <h1>VIVA MENTE</h1>

            <p>Gestão Cognitiva</p>

        </section>


        <!-- ETAPA 1: ESCOLHER PERFIL -->
        <section
            id="login-choice"
            class="login-card"
        >

            <h2>Como deseja entrar?</h2>

            <p class="login-subtitle">
                Selecione o seu tipo de acesso
            </p>


            <div class="login-options">

                <button
                    type="button"
                    class="login-option login-medico"
                    onclick="selectLoginType('medico')"
                >

                    <div class="login-option-icon">
                        <i class="fas fa-user-doctor"></i>
                    </div>

                    <div class="login-option-content">

                        <h3>Entrar como Médico</h3>

                        <p>
                            Acesse o painel clínico e gerencie seus pacientes.
                        </p>

                    </div>

                    <i class="fas fa-chevron-right login-arrow"></i>

                </button>


                <button
                    type="button"
                    class="login-option login-cuidador"
                    onclick="selectLoginType('cuidador')"
                >

                    <div class="login-option-icon">
                        <i class="fas fa-user-nurse"></i>
                    </div>

                    <div class="login-option-content">

                        <h3>Entrar como Cuidador</h3>

                        <p>
                            Acompanhe a rotina e os cuidados do paciente.
                        </p>

                    </div>

                    <i class="fas fa-chevron-right login-arrow"></i>

                </button>

            </div>

        </section>


        <!-- ETAPA 2: E-MAIL E SENHA -->
        <section
            id="login-form-area"
            class="login-card login-hidden"
        >

            <button
                type="button"
                class="login-back"
                onclick="backToChoice()"
            >
                <i class="fas fa-arrow-left"></i>
                Voltar
            </button>


            <div class="login-selected-profile">

                <div
                    id="login-selected-icon"
                    class="login-selected-icon"
                >
                </div>

                <div>

                    <span id="login-modo-texto">Entrando como</span>

                    <h2
                        id="login-selected-name"
                    >
                    </h2>

                </div>

            </div>


            <form
                class="login-form"
                onsubmit="doLogin(event)"
            >

                <!-- só aparece ao criar conta de cuidador -->
                <div
                    class="login-field login-hidden"
                    id="campo-nome"
                >

                    <label for="nome">
                        Seu nome
                    </label>

                    <div class="login-input-wrapper">

                        <i class="fas fa-id-card"></i>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Nome completo"
                        >

                    </div>

                </div>


                <div class="login-field">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="login-input-wrapper">

                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            required
                            autocomplete="email"
                            placeholder="Digite seu e-mail"
                        >

                    </div>

                </div>


                <div class="login-field">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="login-input-wrapper">

                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            required
                            minlength="6"
                            autocomplete="current-password"
                            placeholder="Digite sua senha (mín. 6 caracteres)"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    id="login-submit"
                    class="login-submit"
                >

                    <span id="login-submit-texto">Entrar</span>

                    <i class="fas fa-arrow-right"></i>

                </button>


                <!-- contas de médico são criadas pela clínica, por isso o botão some para médico -->
                <button
                    type="button"
                    id="login-alternar"
                    class="login-back"
                    onclick="alternarModo()"
                >
                    Ainda não tenho conta (cuidador)
                </button>

            </form>

        </section>

    </main>


    <script src="supabase-config.js"></script>
    <script>

        let loginType = "";
        let modoCadastro = false;

        const $ = (id) => document.getElementById(id);


        // Se já existe uma sessão ativa, vai direto para o painel
        // (o index.html confere o perfil e devolve para cá se algo estiver errado).
        (async function () {

            const { data } = await supabaseClient.auth.getSession();

            if (data.session) {
                window.location.href = "index.html";
            }

        })();


        function selectLoginType(type) {

            loginType = type;

            $("login-choice").classList.add("login-hidden");
            $("login-form-area").classList.remove("login-hidden");

            const name = $("login-selected-name");
            const icon = $("login-selected-icon");

            if (type === "medico") {

                name.innerText = "Médico";

                icon.innerHTML =
                    '<i class="fas fa-user-doctor"></i>';

                icon.className =
                    "login-selected-icon login-medico-color";

            } else {

                name.innerText = "Cuidador";

                icon.innerHTML =
                    '<i class="fas fa-user-nurse"></i>';

                icon.className =
                    "login-selected-icon login-cuidador-color";

            }

            modoCadastro = false;
            aplicarModo();

        }


        function backToChoice() {

            $("login-form-area").classList.add("login-hidden");
            $("login-choice").classList.remove("login-hidden");

            $("nome").value = "";
            $("email").value = "";
            $("senha").value = "";

            loginType = "";
            modoCadastro = false;

        }


        function alternarModo() {

            modoCadastro = !modoCadastro;

            aplicarModo();

        }


        function aplicarModo() {

            const ehMedico = loginType === "medico";

            // médico não cria conta pelo site
            $("login-alternar").classList.toggle("login-hidden", ehMedico);

            $("campo-nome").classList.toggle("login-hidden", !modoCadastro);

            $("nome").required = modoCadastro;

            $("login-submit-texto").innerText =
                modoCadastro ? "Criar conta" : "Entrar";

            $("login-modo-texto").innerText =
                modoCadastro ? "Criando conta de" : "Entrando como";

            $("login-alternar").innerText =
                modoCadastro
                    ? "Já tenho conta"
                    : "Ainda não tenho conta (cuidador)";

            $("senha").autocomplete =
                modoCadastro ? "new-password" : "current-password";

        }


        function traduzirErro(msg) {

            const m = (msg || "").toLowerCase();

            if (m.includes("invalid login credentials")) {
                return "E-mail ou senha incorretos.";
            }

            if (m.includes("email not confirmed")) {
                return "Confirme seu e-mail (veja a caixa de entrada) antes de entrar.";
            }

            if (m.includes("already registered")) {
                return "Este e-mail já tem cadastro. Use \"Já tenho conta\".";
            }

            if (m.includes("password")) {
                return "A senha precisa ter pelo menos 6 caracteres.";
            }

            return msg || "Erro inesperado. Tente de novo.";

        }


        async function doLogin(event) {

            event.preventDefault();

            const email = $("email").value.trim();
            const senha = $("senha").value;
            const nome = $("nome").value.trim();

            if (!email || !senha) {
                return;
            }

            if (modoCadastro && !nome) {
                alert("Informe seu nome.");
                return;
            }

            const botao = $("login-submit");
            botao.disabled = true;

            try {

                if (modoCadastro) {

                    const { data, error } =
                        await supabaseClient.auth.signUp({
                            email,
                            password: senha,
                            options: { data: { nome } }
                        });

                    if (error) throw error;

                    // Com "Confirm email" ligado no Supabase, não vem sessão
                    if (!data.session) {

                        alert(
                            "Conta criada! Confirme o e-mail que enviamos e depois entre."
                        );

                        modoCadastro = false;
                        aplicarModo();
                        return;

                    }

                } else {

                    const { error } =
                        await supabaseClient.auth.signInWithPassword({
                            email,
                            password: senha
                        });

                    if (error) throw error;

                }

                // Confere no BANCO se a conta é mesmo do tipo escolhido
                const { data: { user } } =
                    await supabaseClient.auth.getUser();

                const { data: perfil, error: erroPerfil } =
                    await supabaseClient
                        .from("profiles")
                        .select("role, nome")
                        .eq("id", user.id)
                        .single();

                if (erroPerfil) throw erroPerfil;

                if (perfil.role !== loginType) {

                    await supabaseClient.auth.signOut();

                    alert(
                        `Esta conta é de ${perfil.role}. ` +
                        `Volte e escolha "${perfil.role === "medico" ? "Médico" : "Cuidador"}".`
                    );

                    return;

                }

                window.location.href = "index.html";

            } catch (err) {

                alert(traduzirErro(err.message));

            } finally {

                botao.disabled = false;

            }

        }

    </script>

</body>
</html>
